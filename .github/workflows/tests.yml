name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            illuminate: '^12.0'
            testbench: '^10.0'
          - php: '8.4'
            illuminate: '^12.0'
            testbench: '^10.0'
          - php: '8.5'
            illuminate: '^13.0'
            testbench: '^11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer update --no-interaction --prefer-dist --with=illuminate/support:${{ matrix.illuminate }} --with=illuminate/cache:${{ matrix.illuminate }} --with=orchestra/testbench:${{ matrix.testbench }}
      - run: composer validate --strict --no-check-publish
      - run: composer audit
      - run: composer test
      - run: composer phpstan
